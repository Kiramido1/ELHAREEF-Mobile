name: elhareef
description: "ELHAREEF — football pitch booking & matchmaking (Flutter port of the Expo app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pitches/
    - assets/brand/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo_800ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic_600SemiBold.ttf
          weight: 600
